name: MindShield CI & Automated Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Run Tests & Build Bundles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Test Suite
        run: npm test

      - name: Build Standalone MV3 Bundles
        run: npm run build

      - name: Validate Syntax of Bundles
        run: |
          node -c dist/background.bundle.js
          node -c dist/content.bundle.js

      - name: Package Extension ZIP
        run: |
          zip -r mindshield-extension.zip dist icons src manifest.json README.md LICENSE mobile

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindshield-extension-zip
          path: mindshield-extension.zip
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: test-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: mindshield-extension-zip

      - name: Create GitHub Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          files: mindshield-extension.zip
          generate_release_notes: true
          draft: false
          prerelease: false
